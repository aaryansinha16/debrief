name: debrief

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-debrief}
      APP_DB_USER: ${APP_DB_USER:-debrief_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-debrief_app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: mini -bucket=${S3_BUCKET:-debrief} -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-debrief}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-debrief-local-only}
      S3_BUCKET: ${S3_BUCKET:-debrief}
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - s3data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sfI --aws-sigv4 aws:amz:us-east-1:s3 --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" "http://127.0.0.1:8333/$$S3_BUCKET"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

volumes:
  pgdata:
  s3data:
