name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm audit --audit-level high

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: debrief
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/debrief
      DATABASE_URL: postgres://debrief_app:debrief_app@localhost:5432/debrief
      APP_DB_USER: debrief_app
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_BUCKET: debrief
      S3_ACCESS_KEY_ID: debrief
      S3_SECRET_ACCESS_KEY: debrief-local-only
      SIGNING_KEY_SECRET: 9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60
      BLOB_MASTER_KEY: cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start seaweedfs from docker compose
        run: docker compose up -d --wait --wait-timeout 90 seaweedfs || { docker compose logs seaweedfs; exit 1; }
      - name: create the app role and migrate
        run: |
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE debrief_app LOGIN PASSWORD 'debrief_app'" -c "GRANT CONNECT ON DATABASE debrief TO debrief_app" -c "GRANT USAGE ON SCHEMA public TO debrief_app"
          pnpm db:migrate
      # The Claude Code hook's < 2 s budget (P-62) is timed alone too, before the suites compete.
      - name: time the claude code hook alone
        run: pnpm --filter @debrief/cli exec vitest run src/claude-code.e2e.test.ts
        env:
          DEBRIEF_HOOK_TIMING: '1'
      - name: test every package but the sandbox
        run: pnpm test --filter='!@debrief/sandbox' --continue -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      # The demo's < 60 s budget (P-19) is a user's wall clock: time it alone, not under every other suite.
      - name: test the sandbox alone
        if: ${{ !cancelled() }}
        run: pnpm test --filter=@debrief/sandbox --continue -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      # The GitHub witness reads this artifact for the run's test counts (P-66.2); the name must contain "junit".
      - name: upload the JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            apps/*/test-results/junit.xml
            apps/witnesses/*/test-results/junit.xml
            packages/*/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @debrief/web build
      - run: pnpm perf:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PERF_DIAG: '1'
      - run: pnpm --filter @debrief/web theatre:check
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm --filter @debrief/web claims:check
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm --filter @debrief/verify build
      - run: pnpm --filter @debrief/verify verify:check
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm --filter @debrief/web landing:check
        env:
          CHROME_PATH: /usr/bin/google-chrome
